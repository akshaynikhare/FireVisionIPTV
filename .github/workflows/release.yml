name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Third-party actions are pinned to commit SHAs, not tags: this job holds the
      # signing keystore and the Sentry token, and a retargeted tag would run new
      # code in the workspace before the signed build.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # A tag published straight to users without running either gate is how a
      # broken release gets discovered by the people installing it.
      - name: Lint and test before publishing
        run: ./gradlew lintDebug testDebugUnitTest

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV

      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@dfa5a5dd38803cb4f5c3a081eeb28e8362d43e9c # v2.0.0
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}

      - name: Build with Gradle
        env:
          SIGNING_KEY_STORE: ${{ steps.decode_keystore.outputs.filePath }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        # -PrequireSentryUpload: publishing an APK whose crashes cannot be
        # de-obfuscated should fail here, not be discovered in production.
        run: ./gradlew assembleRelease -PversionName=${{ env.VERSION }} -PrequireSentryUpload

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/FireVisionIPTV-${{ env.VERSION }}.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Release ${{ github.ref_name }}
          files: app/build/outputs/apk/release/FireVisionIPTV-${{ env.VERSION }}.apk